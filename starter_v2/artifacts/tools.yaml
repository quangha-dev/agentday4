version: ver2
contract_version: ver2
tools:
  - name: clarify
    description: "Tạm dừng để hỏi đúng một thông tin chỉ người dùng mới cung cấp hoặc quyết định được. Không dùng để hỏi lại dữ kiện có thể lấy từ kho văn bản."
    parameters:
      type: object
      additionalProperties: false
      properties:
        question: {type: string, minLength: 2, maxLength: 1000, description: "Một câu hỏi ngắn, cụ thể."}
        response_type: {type: string, enum: [text, yes_no, choice], default: text}
        options: {type: array, maxItems: 10, default: [], items: {type: string}}
      required: [question]
    returns: {fields: [tool, ok, awaiting_user, question, response_type, options, contract_version]}

  - name: resolve_legal_document
    description: "Tìm và chuẩn hóa văn bản/version đã INDEXED khi selector còn mơ hồ hoặc cần liệt kê version. KHÔNG dùng trước exact/effective lookup nếu user đã nêu số hiệu chính xác dạng có dấu /; các tool đó nhận trực tiếp số hiệu làm document_id."
    parameters:
      type: object
      additionalProperties: false
      properties:
        query: {type: string, minLength: 1, maxLength: 500, description: "Số hiệu, tiêu đề hoặc từ khóa nhận diện văn bản."}
        target_date: {type: string, format: date, description: "Ngày áp dụng YYYY-MM-DD; bỏ hẳn field nếu user không nêu ngày."}
        limit: {type: integer, minimum: 1, maximum: 20, default: 5}
      required: [query]
    returns: {fields: [tool, ok, count, documents, error, contract_version]}

  - name: legal_rag_search
    description: "Tool lấy context chính cho câu hỏi pháp luật tự nhiên khi chưa biết chính xác Điều/Khoản/Điểm. Chỉ tìm tài liệu đã duyệt và INDEXED; trả evidence có citation_id, nội dung luật, version, vị trí và trang PDF. Kết quả rỗng nghĩa là không đủ căn cứ."
    parameters:
      type: object
      additionalProperties: false
      properties:
        query: {type: string, minLength: 2, maxLength: 2000, description: "Câu hỏi/từ khóa pháp lý tập trung."}
        document_type: {type: string, default: all, maxLength: 200}
        legal_domain: {type: string, default: all, maxLength: 200}
        document_number: {type: string, maxLength: 200, description: "Số hiệu chính xác; bỏ field nếu không có, không truyền null."}
        target_date: {type: string, format: date, description: "YYYY-MM-DD; bỏ field nếu không có, không truyền null."}
        top_k: {type: integer, minimum: 1, maximum: 10, default: 5}
      required: [query]
    returns: {fields: [tool, ok, query, count, evidence, retrieval, error, contract_version]}

  - name: get_legal_provision
    description: "Tra cứu chính xác một Điều/Khoản/Điểm trong cây pháp luật đã parse. Khi user nêu số hiệu chính xác có dấu / và số Điều, gọi trực tiếp tool này, document_id chính là số hiệu; không resolve trước. Không tự đoán vị trí còn thiếu."
    parameters:
      type: object
      additionalProperties: false
      properties:
        document_id: {type: string, minLength: 1, maxLength: 500, description: "UUID, số hiệu, tiêu đề chính xác hoặc selector <số-hiệu>@vN."}
        article: {type: string, minLength: 1, maxLength: 100, description: "Chỉ marker, ví dụ 4; không truyền chữ Điều."}
        clause: {type: string, maxLength: 100, description: "Chỉ marker, ví dụ 2; bỏ field nếu không có."}
        point: {type: string, maxLength: 100, description: "Chỉ marker, ví dụ a; bỏ field nếu không có."}
      required: [document_id, article]
    returns: {fields: [tool, ok, found, evidence, error, contract_version]}

  - name: check_effective_status
    description: "Kiểm tra document/version có hiệu lực tại đúng một ngày. Nếu đã có số hiệu chính xác và ngày, gọi trực tiếp với số hiệu làm document_id, không resolve trước. unavailable/unknown/replaced/not_yet_effective không được dùng làm căn cứ hiện hành."
    parameters:
      type: object
      additionalProperties: false
      properties:
        document_id: {type: string, minLength: 1, maxLength: 500}
        target_date: {type: string, format: date}
        article: {type: string, maxLength: 100, description: "Chỉ marker; bỏ field nếu không có."}
        clause: {type: string, maxLength: 100, description: "Chỉ marker; bỏ field nếu không có."}
        point: {type: string, maxLength: 100, description: "Chỉ marker; bỏ field nếu không có."}
      required: [document_id, target_date]
    returns: {fields: [tool, ok, document_id, status, effective_from, effective_to, replaced_by, error, contract_version]}

  - name: compare_legal_versions
    description: "So sánh hai version cụ thể đã INDEXED. Chỉ dùng khi user yêu cầu so sánh/thay đổi; không tự chọn hai bản nếu chưa phân biệt được."
    parameters:
      type: object
      additionalProperties: false
      properties:
        old_document_id: {type: string, minLength: 1, maxLength: 500}
        new_document_id: {type: string, minLength: 1, maxLength: 500}
        article: {type: string, maxLength: 100, description: "Chỉ marker; bỏ field nếu không có."}
        clause: {type: string, maxLength: 100, description: "Chỉ marker; bỏ field nếu không có."}
        point: {type: string, maxLength: 100, description: "Chỉ marker; bỏ field nếu không có."}
      required: [old_document_id, new_document_id]
    returns: {fields: [tool, ok, old_document, new_document, changes, evidence, error, contract_version]}

  - name: extract_legal_information
    description: "Bóc tách chủ thể, hành vi, quyền, nghĩa vụ, thời hạn, mức phạt hoặc ngoại lệ từ citation đã lưu. Chỉ nhận citation_id; backend tự đọc nguyên văn, model không được truyền content tự soạn."
    parameters:
      type: object
      additionalProperties: false
      properties:
        citation_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 100}
        fields:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          default: [subject, conduct, rights, obligations, deadline, penalty, exceptions]
          items: {type: string, enum: [subject, conduct, rights, obligations, deadline, penalty, exceptions]}
      required: [citation_ids]
    returns: {fields: [tool, ok, evidence_ids, subject, conduct, rights, obligations, deadline, penalty, exceptions, error, contract_version]}

  - name: validate_citation
    description: "Gate bắt buộc trước mọi kết luận pháp lý. Kiểm tra từng claim nguyên tử với citation_id và ngày áp dụng. valid=false buộc tìm lại hoặc báo thiếu căn cứ."
    parameters:
      type: object
      additionalProperties: false
      properties:
        claims:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            properties:
              claim: {type: string, minLength: 2, maxLength: 4000}
              citation_id: {type: string, minLength: 1, maxLength: 100}
            required: [claim, citation_id]
        target_date: {type: string, format: date}
      required: [claims, target_date]
    returns: {fields: [tool, ok, valid, results, errors, error, contract_version]}
