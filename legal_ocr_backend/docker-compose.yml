services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: legal_ocr
      POSTGRES_USER: legal_ocr
      POSTGRES_PASSWORD: legal_ocr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_ocr -d legal_ocr"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.6
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  api:
    build: .
    environment:
      CONTRACT_VERSION: ver2
      DATABASE_URL: postgresql+psycopg://legal_ocr:legal_ocr@postgres:5432/legal_ocr
      QDRANT_URL: http://qdrant:6333
      ENABLE_TRANSFORMER_EMBEDDING: "true"
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      QDRANT_COLLECTION: legal_provisions_ver2
      UPLOAD_DIR: /app/data/uploads
      PAGE_IMAGE_DIR: /app/data/page_images
      EXPORT_DIR: /app/data/exports
      FRONTEND_ORIGINS: http://localhost:3000,http://localhost:5173
      PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      LLM_CLEANUP_PROVIDER: ${LLM_CLEANUP_PROVIDER:-openrouter}
      LLM_CLEANUP_MODEL: ${LLM_CLEANUP_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - app_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  agent:
    build:
      context: ../starter_v2
    environment:
      AGENT_ARTIFACT_VERSION: ver2
      AGENT_PROVIDER: ${AGENT_PROVIDER:-groq}
      AGENT_MODEL: ${AGENT_MODEL:-openai/gpt-oss-120b}
      AGENT_MAX_TOOL_ROUNDS: "6"
      AGENT_FRONTEND_ORIGINS: http://localhost:3000,http://localhost:5173
      LEGAL_OCR_API_URL: http://api:8000/api/v1
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
    ports:
      - "8502:8502"
    depends_on:
      - api

  frontend:
    build:
      context: ../legal_ocr_frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_AGENT_API_URL: http://localhost:8502
    ports:
      - "3000:3000"
    depends_on:
      - api
      - agent

volumes:
  postgres_data:
  qdrant_data:
  app_data:
